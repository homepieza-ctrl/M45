          cat > "app/src/main/java/com/example/m45tws/VSlider.kt" <<'__FIN__'
          package com.example.m45tws

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.View

          /** Control deslizante vertical (una banda del ecualizador). progress: 0 (abajo) a 1 (arriba). */
          class VSlider(ctx: Context) : View(ctx) {
              var progress: Float = 0.5f
                  set(v) { field = v.coerceIn(0f, 1f); invalidate() }
              var onChange: ((Float) -> Unit)? = null

              private val d = ctx.resources.displayMetrics.density
              private val track = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#1E2022"); strokeWidth = 6f * d; strokeCap = Paint.Cap.ROUND
              }
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#00E5FF"); strokeWidth = 6f * d; strokeCap = Paint.Cap.ROUND
              }
              private val mark = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#B0B3B8"); strokeWidth = 1f * d
              }
              private val thumb = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#141414") }
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; style = Paint.Style.STROKE; strokeWidth = 0.8f * d
              }

              override fun onDraw(canvas: Canvas) {
                  val pad = 12f * d
                  val x = width / 2f
                  val top = pad
                  val bot = height - pad
                  val mid = (top + bot) / 2f
                  val y = bot - progress * (bot - top)
                  canvas.drawLine(x, top, x, bot, track)
                  canvas.drawLine(x, mid, x, y, fill)
                  canvas.drawLine(x - 9f * d, mid, x + 9f * d, mid, mark)
                  canvas.drawCircle(x, y, 9f * d, thumb)
                  canvas.drawCircle(x, y, 9f * d, ring)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (e.action == MotionEvent.ACTION_DOWN || e.action == MotionEvent.ACTION_MOVE) {
                      parent?.requestDisallowInterceptTouchEvent(true)
                      val pad = 12f * d
                      val top = pad
                      val bot = height - pad
                      progress = 1f - (e.y - top) / (bot - top)
                      onChange?.invoke(progress)
                  }
                  return true
              }
          }
          __FIN__
