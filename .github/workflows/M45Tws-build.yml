name: Build M45 Tws APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generar proyecto completo
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'__FIN__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.m45tws"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.m45tws"
                  minSdk = 26
                  // targetSdk 32 permite que adapter.enable()/disable() sigan funcionando en Android 13+
                  targetSdk = 32
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          __FIN__
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'__FIN__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>

              <application android:label="M45 Tws"
                  android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatService" android:exported="false"/>
              </application>
          </manifest>
          __FIN__
          mkdir -p "app/src/main/java/com/example/m45tws"
          cat > "app/src/main/java/com/example/m45tws/FloatService.kt" <<'__FIN__'
          package com.example.m45tws

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.StateListDrawable
          import android.media.AudioManager
          import android.media.audiofx.Equalizer
          import android.os.IBinder
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Random
          import kotlin.math.abs

          class FloatService : Service() {

              private lateinit var wm: WindowManager
              private lateinit var vib: Vibrator
              private lateinit var audio: AudioManager
              private lateinit var texBoton: Bitmap
              private lateinit var ledVerde: View
              private lateinit var ledRojo: View
              private lateinit var panel: LinearLayout
              private lateinit var vistaMain: LinearLayout
              private lateinit var vistaEq: LinearLayout
              private lateinit var sliderBox: LinearLayout
              private lateinit var lpPanel: WindowManager.LayoutParams
              private lateinit var lpBubble: WindowManager.LayoutParams
              private var bubble: View? = null
              private var panelAbierto = false
              private var eq: Equalizer? = null
              private val sliders = ArrayList<VSlider>()

              private val presets = listOf(
                  "Rock" to floatArrayOf(0.55f, 0.30f, -0.20f, 0.35f, 0.55f),
                  "Clásico" to floatArrayOf(0.40f, 0.20f, 0.00f, 0.25f, 0.35f),
                  "Cine" to floatArrayOf(0.60f, 0.10f, 0.35f, 0.20f, 0.45f),
                  "Blues" to floatArrayOf(0.20f, 0.45f, 0.30f, 0.00f, -0.20f),
                  "Normal" to floatArrayOf(0f, 0f, 0f, 0f, 0f)
              )

              private val rx = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      val st = i?.getIntExtra(BluetoothAdapter.EXTRA_STATE, -1) ?: -1
                      if (st == BluetoothAdapter.STATE_ON || st == BluetoothAdapter.STATE_OFF) actualizarLed()
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  iniciarNotificacion()
                  if (bubble == null) crearTodo() else abrirPanel()
                  return START_STICKY
              }

              private fun iniciarNotificacion() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("m45", "M45 Tws", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "m45")
                      .setContentTitle("M45 Tws activo")
                      .setSmallIcon(android.R.drawable.stat_sys_data_bluetooth)
                      .build()
                  startForeground(1, n)
              }

              // ---------- utilidades ----------
              private fun dp(v: Float): Float = v * resources.displayMetrics.density
              private fun dpi(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun aviso(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()

              private fun vibrar() =
                  vib.vibrate(VibrationEffect.createOneShot(20, VibrationEffect.DEFAULT_AMPLITUDE))

              private fun ruido(alphaMax: Int, semilla: Long): Bitmap {
                  val s = 64
                  val bmp = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val rnd = Random(semilla)
                  for (x in 0 until s) for (y in 0 until s) {
                      val v = rnd.nextInt(256)
                      bmp.setPixel(x, y, Color.argb(rnd.nextInt(alphaMax), v, v, v))
                  }
                  return bmp
              }

              // ---------- componentes de UI ----------
              private fun boton(texto: String, accion: () -> Unit): TextView {
                  fun fondo(presionado: Boolean) = TexDrawable(
                      texBoton, Color.parseColor("#141414"), Color.parseColor("#000000"),
                      dp(8f), Color.WHITE, dp(0.8f), dp(4f), presionado
                  )
                  val sl = StateListDrawable()
                  sl.addState(intArrayOf(android.R.attr.state_pressed), fondo(true))
                  sl.addState(intArrayOf(), fondo(false))
                  val tv = TextView(this)
                  tv.text = texto
                  tv.setTextColor(Color.WHITE)
                  tv.textSize = 11f
                  tv.typeface = Typeface.DEFAULT_BOLD
                  tv.gravity = Gravity.CENTER
                  tv.maxLines = 1
                  tv.background = sl
                  tv.isClickable = true
                  tv.setOnClickListener { vibrar(); accion() }
                  return tv
              }

              private fun fila(vararg v: View): LinearLayout {
                  val f = LinearLayout(this)
                  f.orientation = LinearLayout.HORIZONTAL
                  val m = dpi(3)
                  for (x in v) {
                      val p = LinearLayout.LayoutParams(0, dpi(36), 1f)
                      p.setMargins(m, m, m, m)
                      f.addView(x, p)
                  }
                  return f
              }

              private fun pintarLed(v: View, color: Int, encendido: Boolean) {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setColor(
                      if (encendido) color
                      else Color.rgb(Color.red(color) / 6, Color.green(color) / 6, Color.blue(color) / 6)
                  )
                  g.setStroke(dpi(1), if (encendido) Color.WHITE else Color.parseColor("#2A2A2A"))
                  v.background = g
              }

              private fun actualizarLed() {
                  val on = (getSystemService(BLUETOOTH_SERVICE) as BluetoothManager).adapter?.isEnabled == true
                  pintarLed(ledVerde, Color.parseColor("#00E676"), on)
                  pintarLed(ledRojo, Color.parseColor("#FF1744"), !on)
              }

              // ---------- construcción ----------
              private fun crearTodo() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  vib = getSystemService(VIBRATOR_SERVICE) as Vibrator
                  audio = getSystemService(AUDIO_SERVICE) as AudioManager
                  texBoton = ruido(45, 1L)
                  construirPanel()
                  crearBubble()
                  registerReceiver(rx, IntentFilter(BluetoothAdapter.ACTION_STATE_CHANGED))
                  actualizarLed()
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun construirPanel() {
                  val texFondo = ruido(75, 7L)
                  panel = LinearLayout(this)
                  panel.orientation = LinearLayout.VERTICAL
                  val p = dpi(8)
                  panel.setPadding(p, p, p, p)
                  panel.background = TexDrawable(
                      texFondo, Color.parseColor("#6E7176"), 0, dp(16f),
                      Color.parseColor("#2B2D30"), dp(2f), 0f, false
                  )

                  // Título + LEDs (también sirve para arrastrar el panel)
                  val titulo = LinearLayout(this)
                  titulo.orientation = LinearLayout.HORIZONTAL
                  titulo.gravity = Gravity.CENTER_VERTICAL
                  titulo.setPadding(dpi(4), dpi(2), dpi(4), dpi(4))
                  val nombre = TextView(this)
                  nombre.text = "M45 Tws"
                  nombre.setTextColor(Color.WHITE)
                  nombre.textSize = 15f
                  nombre.typeface = Typeface.DEFAULT_BOLD
                  titulo.addView(nombre, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  ledVerde = View(this)
                  ledRojo = View(this)
                  for (l in listOf(ledVerde, ledRojo)) {
                      val lpl = LinearLayout.LayoutParams(dpi(12), dpi(12))
                      lpl.setMargins(dpi(4), 0, 0, 0)
                      titulo.addView(l, lpl)
                  }
                  panel.addView(titulo)

                  // Vista principal
                  vistaMain = LinearLayout(this)
                  vistaMain.orientation = LinearLayout.VERTICAL
                  vistaMain.addView(fila(boton("Prender BT") { bt(true) }, boton("Apagar BT") { bt(false) }))
                  vistaMain.addView(fila(
                      boton("Vol −") { volumen(AudioManager.ADJUST_LOWER) },
                      boton("Vol +") { volumen(AudioManager.ADJUST_RAISE) }
                  ))
                  vistaMain.addView(fila(boton("Ecualizador") { mostrarEq() }, boton("Salir") { stopSelf() }))
                  panel.addView(vistaMain)

                  // Vista del ecualizador
                  vistaEq = LinearLayout(this)
                  vistaEq.orientation = LinearLayout.VERTICAL
                  vistaEq.visibility = View.GONE
                  val tEq = TextView(this)
                  tEq.text = "Ecualizador"
                  tEq.setTextColor(Color.WHITE)
                  tEq.textSize = 12f
                  tEq.typeface = Typeface.DEFAULT_BOLD
                  tEq.gravity = Gravity.CENTER
                  vistaEq.addView(tEq)
                  val bp = presets.map { pr -> boton(pr.first) { aplicarPreset(pr.second) } }
                  vistaEq.addView(fila(bp[0], bp[1], bp[2]))
                  vistaEq.addView(fila(bp[3], bp[4], boton("Volver") { volverMain() }))
                  sliderBox = LinearLayout(this)
                  sliderBox.orientation = LinearLayout.HORIZONTAL
                  sliderBox.setPadding(dpi(4), dpi(6), dpi(4), dpi(4))
                  val fb = GradientDrawable()
                  fb.cornerRadius = dp(10f)
                  fb.setColor(Color.parseColor("#3A3C40"))
                  sliderBox.background = fb
                  val slp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  slp.setMargins(dpi(3), dpi(4), dpi(3), dpi(3))
                  vistaEq.addView(sliderBox, slp)
                  panel.addView(vistaEq)

                  lpPanel = WindowManager.LayoutParams(
                      dpi(220), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lpPanel.gravity = Gravity.TOP or Gravity.START

                  var ix = 0
                  var iy = 0
                  var tx = 0f
                  var ty = 0f
                  titulo.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { ix = lpPanel.x; iy = lpPanel.y; tx = e.rawX; ty = e.rawY }
                          MotionEvent.ACTION_MOVE -> {
                              lpPanel.x = ix + (e.rawX - tx).toInt()
                              lpPanel.y = iy + (e.rawY - ty).toInt()
                              if (panelAbierto) wm.updateViewLayout(panel, lpPanel)
                          }
                      }
                      true
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun crearBubble() {
                  val tam = dpi(52)
                  val fr = FrameLayout(this)
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(Color.parseColor("#141414"))
                  bg.setStroke(dpi(1), Color.WHITE)
                  fr.background = bg
                  val pad = dpi(3)
                  fr.setPadding(pad, pad, pad, pad)
                  val iv = ImageView(this)
                  iv.setImageResource(R.mipmap.ic_launcher)
                  iv.scaleType = ImageView.ScaleType.CENTER_CROP
                  iv.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(view: View, outline: Outline) {
                          outline.setOval(0, 0, view.width, view.height)
                      }
                  }
                  iv.clipToOutline = true
                  fr.addView(iv, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  lpBubble = WindowManager.LayoutParams(
                      tam, tam,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lpBubble.gravity = Gravity.TOP or Gravity.START
                  lpBubble.x = dpi(8)
                  lpBubble.y = dpi(300)

                  var ix = 0
                  var iy = 0
                  var tx = 0f
                  var ty = 0f
                  var movido = false
                  fr.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              ix = lpBubble.x; iy = lpBubble.y; tx = e.rawX; ty = e.rawY; movido = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - tx
                              val dy = e.rawY - ty
                              if (abs(dx) > dpi(6) || abs(dy) > dpi(6)) movido = true
                              if (movido) {
                                  lpBubble.x = ix + dx.toInt()
                                  lpBubble.y = iy + dy.toInt()
                                  wm.updateViewLayout(fr, lpBubble)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!movido) { vibrar(); alternarPanel() }
                          }
                      }
                      true
                  }

                  try {
                      wm.addView(fr, lpBubble)
                      bubble = fr
                  } catch (e: Exception) {
                      aviso("No se pudo mostrar el botón flotante")
                      stopSelf()
                  }
              }

              // ---------- panel ----------
              private fun alternarPanel() { if (panelAbierto) cerrarPanel() else abrirPanel() }

              private fun abrirPanel() {
                  if (panelAbierto) return
                  vistaEq.visibility = View.GONE
                  vistaMain.visibility = View.VISIBLE
                  val ancho = dpi(220)
                  val m = resources.displayMetrics
                  var x = lpBubble.x + dpi(58)
                  if (x + ancho > m.widthPixels) x = maxOf(0, lpBubble.x - ancho - dpi(6))
                  lpPanel.x = x
                  lpPanel.y = minOf(lpBubble.y, maxOf(0, m.heightPixels - dpi(320)))
                  try {
                      wm.addView(panel, lpPanel)
                      panelAbierto = true
                  } catch (e: Exception) {
                      aviso("No se pudo abrir el panel")
                  }
                  actualizarLed()
              }

              private fun cerrarPanel() {
                  if (!panelAbierto) return
                  try { wm.removeView(panel) } catch (e: Exception) {}
                  panelAbierto = false
              }

              private fun volverMain() {
                  vistaEq.visibility = View.GONE
                  vistaMain.visibility = View.VISIBLE
              }

              // ---------- acciones ----------
              @SuppressLint("MissingPermission")
              private fun bt(encender: Boolean) {
                  val ad = (getSystemService(BLUETOOTH_SERVICE) as BluetoothManager).adapter
                  if (ad == null) { aviso("Este equipo no tiene Bluetooth"); return }
                  if (ad.isEnabled == encender) { actualizarLed(); return }
                  val ok = try {
                      if (encender) ad.enable() else ad.disable()
                  } catch (e: SecurityException) {
                      false
                  }
                  if (!ok) aviso("Android bloqueó la acción. Activa el permiso 'Dispositivos cercanos'")
              }

              private fun volumen(dir: Int) =
                  audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, dir, AudioManager.FLAG_SHOW_UI)

              // ---------- ecualizador ----------
              private fun asegurarEq(): Equalizer? {
                  eq?.let { return it }
                  return try {
                      val e = Equalizer(0, 0)
                      e.enabled = true
                      eq = e
                      e
                  } catch (ex: Exception) {
                      aviso("Tu equipo no permite el ecualizador global")
                      null
                  }
              }

              private fun mostrarEq() {
                  val e = asegurarEq() ?: return
                  if (sliders.size != e.numberOfBands.toInt()) construirSliders(e) else sincronizar(e)
                  vistaMain.visibility = View.GONE
                  vistaEq.visibility = View.VISIBLE
              }

              private fun construirSliders(e: Equalizer) {
                  val n = e.numberOfBands.toInt()
                  val r = e.bandLevelRange
                  val lo = r[0].toInt()
                  val hi = r[1].toInt()
                  sliders.clear()
                  sliderBox.removeAllViews()
                  for (b in 0 until n) {
                      val col = LinearLayout(this)
                      col.orientation = LinearLayout.VERTICAL
                      col.gravity = Gravity.CENTER_HORIZONTAL
                      val s = VSlider(this)
                      s.progress = (e.getBandLevel(b.toShort()).toInt() - lo).toFloat() / (hi - lo)
                      s.onChange = { prog ->
                          val nivel = (lo + prog * (hi - lo)).toInt().coerceIn(lo, hi)
                          try { e.setBandLevel(b.toShort(), nivel.toShort()) } catch (ex: Exception) {}
                      }
                      col.addView(s, LinearLayout.LayoutParams(dpi(34), dpi(110)))
                      val hz = e.getCenterFreq(b.toShort()) / 1000
                      val tv = TextView(this)
                      tv.text = if (hz >= 1000) String.format("%.1fk", hz / 1000f) else hz.toString()
                      tv.setTextColor(Color.WHITE)
                      tv.textSize = 9f
                      tv.gravity = Gravity.CENTER
                      col.addView(tv)
                      sliderBox.addView(col, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      sliders.add(s)
                  }
              }

              private fun sincronizar(e: Equalizer) {
                  val r = e.bandLevelRange
                  val lo = r[0].toInt()
                  val hi = r[1].toInt()
                  for (b in 0 until sliders.size) {
                      sliders[b].progress = (e.getBandLevel(b.toShort()).toInt() - lo).toFloat() / (hi - lo)
                  }
              }

              private fun aplicarPreset(p: FloatArray) {
                  val e = asegurarEq() ?: return
                  val n = e.numberOfBands.toInt()
                  val r = e.bandLevelRange
                  val lo = r[0].toInt()
                  val hi = r[1].toInt()
                  if (sliders.size != n) construirSliders(e)
                  for (b in 0 until n) {
                      val pos = if (n <= 1) 0f else b * 4f / (n - 1)
                      val i = minOf(pos.toInt(), 3)
                      val t = pos - i
                      val v = p[i] * (1 - t) + p[i + 1] * t
                      val nivel = (v * hi).toInt().coerceIn(lo, hi)
                      try { e.setBandLevel(b.toShort(), nivel.toShort()) } catch (ex: Exception) {}
                      sliders[b].progress = (nivel - lo).toFloat() / (hi - lo)
                  }
              }

              override fun onDestroy() {
                  try { unregisterReceiver(rx) } catch (e: Exception) {}
                  if (::panel.isInitialized) cerrarPanel()
                  bubble?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  bubble = null
                  try { eq?.release() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          __FIN__
          mkdir -p "app/src/main/java/com/example/m45tws"
          cat > "app/src/main/java/com/example/m45tws/MainActivity.kt" <<'__FIN__'
          package com.example.m45tws

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast

          class MainActivity : Activity() {
              private var pidioOverlay = false
              private var pidioBt = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }

              override fun onResume() {
                  super.onResume()
                  continuar()
              }

              private fun continuar() {
                  if (!Settings.canDrawOverlays(this)) {
                      if (pidioOverlay) {
                          Toast.makeText(this, "Falta el permiso 'Mostrar sobre otras apps'", Toast.LENGTH_LONG).show()
                          finish()
                          return
                      }
                      pidioOverlay = true
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 31 && !pidioBt &&
                      checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                      pidioBt = true
                      requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT), 2)
                      return
                  }
                  startForegroundService(Intent(this, FloatService::class.java))
                  finish()
              }
          }
          __FIN__
          mkdir -p "app/src/main/java/com/example/m45tws"
          cat > "app/src/main/java/com/example/m45tws/TexDrawable.kt" <<'__FIN__'
          package com.example.m45tws

          import android.graphics.Bitmap
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.ColorFilter
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.Drawable

          /** Rectángulo redondeado texturado con borde fino y profundidad (sombra inferior). */
          class TexDrawable(
              noise: Bitmap,
              private val base: Int,
              private val shadow: Int,
              private val radius: Float,
              private val strokeColor: Int,
              private val strokeW: Float,
              private val depth: Float,
              private val pressed: Boolean
          ) : Drawable() {

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tex = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  shader = BitmapShader(noise, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
              }
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = strokeW
              }

              override fun draw(c: Canvas) {
                  val b = bounds
                  val l = b.left.toFloat()
                  val t = b.top.toFloat()
                  val r = b.right.toFloat()
                  val bt = b.bottom.toFloat()
                  if (depth > 0f) {
                      fill.color = shadow
                      c.drawRoundRect(RectF(l, t + depth, r, bt), radius, radius, fill)
                  }
                  val dy = if (pressed) depth * 0.7f else 0f
                  val face = RectF(l, t + dy, r, bt - depth + dy)
                  fill.color = base
                  c.drawRoundRect(face, radius, radius, fill)
                  c.drawRoundRect(face, radius, radius, tex)
                  if (strokeW > 0f) {
                      line.color = strokeColor
                      val h = strokeW / 2f
                      c.drawRoundRect(
                          RectF(face.left + h, face.top + h, face.right - h, face.bottom - h),
                          radius, radius, line
                      )
                  }
              }

              override fun setAlpha(alpha: Int) {}
              override fun setColorFilter(colorFilter: ColorFilter?) {}
              @Deprecated("Deprecated in Java")
              override fun getOpacity(): Int = PixelFormat.TRANSLUCENT
          }
